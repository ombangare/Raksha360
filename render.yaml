services:
  - type: web
    name: raksha360-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: RAKSHA360_ENV
        value: production
      - key: RAKSHA360_SEED_DEMO_DATA
        value: "false"
      - key: RAKSHA360_CORS_ORIGINS
        value: https://raksha360-policedashboard.vercel.app
      - key: DATABASE_URL
        sync: false
      - key: RAKSHA360_DEVICE_TOKEN
        generateValue: true
      - key: RAKSHA360_DASHBOARD_TOKEN
        generateValue: true
      - key: ELEVENLABS_AGENT_ID
        value: agent_3701m51qchkaenxsjnzr8jvrm66
      - key: ELEVENLABS_API_KEY
        sync: false

